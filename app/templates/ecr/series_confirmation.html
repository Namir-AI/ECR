<dialog class="confirmation-dialog" data-series-dialog aria-labelledby="series-dialog-title" aria-describedby="series-dialog-message">
  <h2 id="series-dialog-title">Change Cooling Tower Series?</h2>
  <p id="series-dialog-message">Changing the Series may affect which equipment sections apply to this E&amp;C report. Do you want to change the Series from “<strong data-series-current></strong>” to “<strong data-series-new></strong>”?</p>
  <p class="muted">Previously saved technical data will be preserved.</p>
  <div class="confirmation-actions">
    <button type="button" class="secondary" data-series-cancel autofocus>Cancel</button>
    <button type="button" data-series-confirm>Change Series</button>
  </div>
</dialog>
