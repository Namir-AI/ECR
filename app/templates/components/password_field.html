{% macro password_field(label, name, autocomplete) -%}
<div class="password-field-group">
  <label for="{{ name }}">{{ label }}</label>
  <div class="password-input-row">
    <input id="{{ name }}" type="password" name="{{ name }}" required autocomplete="{{ autocomplete }}">
    <button
      type="button"
      class="password-toggle"
      data-password-toggle
      data-password-target="{{ name }}"
      data-show-label="Show password"
      data-hide-label="Hide password"
      aria-controls="{{ name }}"
      aria-pressed="false"
      aria-label="Show password"
      title="Show password"
    >
      <svg class="password-icon password-icon-eye" data-password-eye viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
        <circle cx="12" cy="12" r="2.5"></circle>
      </svg>
      <svg class="password-icon password-icon-eye-off" data-password-eye-off viewBox="0 0 24 24" aria-hidden="true" hidden>
        <path d="m3 3 18 18"></path>
        <path d="M10.6 6.1A10.8 10.8 0 0 1 12 6c6 0 9.5 6 9.5 6a16.7 16.7 0 0 1-2.4 3.2M6.2 6.2C3.9 7.8 2.5 12 2.5 12s3.5 6 9.5 6c1.6 0 3-.4 4.2-1"></path>
        <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
      </svg>
    </button>
  </div>
</div>
{%- endmacro %}
